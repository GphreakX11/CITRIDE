[project]
name = "citride-demo"
version = "0.1.0"
description = "Synthetic CITRIDE relationship and impact demonstration"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "rdflib>=7.1,<8",
  "pyshacl>=0.30,<1",
  "owlrl==7.6.2",
  "psycopg[binary]==3.2.13",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["citride"]
artifacts = ["citride/demo_data/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
