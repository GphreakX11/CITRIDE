name: Validate demo
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: citride_test
          POSTGRES_PASSWORD: ci_ephemeral_test_password
          POSTGRES_DB: citride_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U citride_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://citride_test:ci_ephemeral_test_password@127.0.0.1:5432/citride_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.4'
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: bash scripts/setup.sh
      - run: bash scripts/check.sh
